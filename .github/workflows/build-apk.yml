name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP" -d source

      - name: Build APK
        run: |
          cd source/HadiqatAlHisab
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Hadiqat-AlHisab-APK
          path: source/HadiqatAlHisab/app/build/outputs/apk/debug/app-debug.apk
